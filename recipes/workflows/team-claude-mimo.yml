version: 3

# Three-step repository-grounded coding workflow, mimo-v2.6-pro coding lanes:
# architect -> developer tournament -> review-and-fix.
# The team-claude.yml sibling that swaps the coding lanes' model — implement
# and review run mimo-v2.6-pro instead of deepseek-flash — so the develop
# matrix can pair one task against both coding models. The architect stage is
# mimo-v2.6-pro in both, so this file differs from team-claude.yml only in the
# two lane model lines.
workflow:
  name: team-claude-mimo
  nodes:
    - stage:
        name: architect
        worker: coding-architect
        harness: claude
        model: mimo-v2.6-pro
        thinkingLevel: max
        discuss: true
        tools: [Read, Bash, Edit, Write, Glob, Grep, WebSearch]
        handoff: architecture.json
        validate: true
        from: []
    - tournament:
        name: candidates
        from: [architect]
        over: architect.implementation_plan
        count: 2
        entry: implement
        exit: implement
        nodes:
          - stage:
              name: implement
              worker: coding-developer
              harness: claude
              model: mimo-v2.6-pro
              thinkingLevel: max
              tools: [Read, Bash, Edit, Write, Glob, Grep]
              handoff: candidate-input.json
              validate: true
              from: []
    - stage:
        name: review
        worker: coding-reviewer
        harness: claude
        model: mimo-v2.6-pro
        thinkingLevel: max
        tools: [Read, Bash, Edit, Write, Glob, Grep]
        handoff: review-input.json
        validate: true
        from: [candidates]
