version: 3

# Cuda-tuning eval-matrix cell: harness=codex, model=gpt-5.6-luna, shape=serial.
# Codex owns the shell/edit sandbox; the stage tools list remains Piano's
# capability contract and is validated against the Codex catalog.
workflow:
  name: gpu-cuda-tuning-codex-luna
  nodes:
    - stage:
        name: setup
        worker: cuda-setup
        harness: codex
        model: gpt-5.6-luna
        thinkingLevel: high
        tools: [read, bash, edit, write]
        handoff: preparation.json
        validate: true
        from: []

    - loop:
        name: tune
        from: [setup]
        feedback: measure
        entry: profile
        exit: measure
        iterations: 10
        nodes:
          - stage:
              name: profile
              worker: cuda-profile
              harness: codex
              model: gpt-5.6-luna
              thinkingLevel: high
              tools: [read, bash, edit, write]
              handoff: iteration.json
              validate: true
              from: []

          - stage:
              name: idea
              worker: cuda-idea
              harness: codex
              model: gpt-5.6-luna
              thinkingLevel: high
              tools: [read, bash, edit, write]
              handoff: profile.json
              validate: true
              from: [profile]

          - stage:
              name: implement
              worker: cuda-implement-verify
              harness: codex
              model: gpt-5.6-luna
              thinkingLevel: high
              tools: [read, bash, edit, write]
              handoff: implementation-inputs.json
              validate: true
              from: [profile, idea]

          - stage:
              name: measure
              worker: cuda-benchmark-store
              harness: codex
              model: gpt-5.6-luna
              thinkingLevel: high
              tools: [read, bash, edit, write]
              handoff: round.json
              validate: true
              from: [idea, implement]

    - stage:
        name: summary
        worker: cuda-summary
        harness: codex
        model: gpt-5.6-luna
        thinkingLevel: high
        tools: [read, bash, edit, write]
        handoff: tuning.json
        validate: true
        from: [tune]
