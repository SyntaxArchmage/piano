version: 3

# Cuda-tuning eval-matrix cell: harness=claude, model=gpt-5.6-luna, shape=tournament (race count 3).
# Same stage pipeline as the gpu-cuda-tuning family twins; only the
# harness/model/tools lines differ between cells of the matrix.
workflow:
  name: gpu-cuda-tuning-tournament-luna
  nodes:
    - stage:
        name: setup
        worker: cuda-setup
        harness: claude
        model: gpt-5.6-luna
        thinkingLevel: high
        tools: [Read, Bash, Edit, Write]
        from: []

    - loop:
        name: tune
        from: [setup]
        feedback: race
        entry: profile
        exit: race          # the tournament region; resolves to its exit leaf `measure`
        iterations: 10
        nodes:
          - stage:
              name: profile
              worker: cuda-profile
              harness: claude
              model: gpt-5.6-luna
              thinkingLevel: high
              tools: [Read, Bash, Edit, Write]
              from: []

          - stage:
              name: idea
              worker: cuda-idea-tournament
              harness: claude
              model: gpt-5.6-luna
              thinkingLevel: high
              tools: [Read, Bash, Edit, Write]
              from: [profile]

          - tournament:
              name: race
              from: [idea]
              over: idea.strategies
              count: 3
              entry: implement
              exit: measure
              nodes:
                - stage:
                    name: implement
                    worker: cuda-implement-verify
                    harness: claude
                    model: gpt-5.6-luna
                    thinkingLevel: high
                    tools: [Read, Bash, Edit, Write]
                    from: []        # slot entry: this lane's strategy arrives as injected map-item context

                - stage:
                    name: measure
                    worker: cuda-benchmark-store
                    harness: claude
                    model: gpt-5.6-luna
                    thinkingLevel: high
                    tools: [Read, Bash, Edit, Write]
                    from: [implement]

    - stage:
        name: summary
        worker: cuda-summary
        harness: claude
        model: gpt-5.6-luna
        thinkingLevel: high
        tools: [Read, Bash, Edit, Write]
        from: [tune]
