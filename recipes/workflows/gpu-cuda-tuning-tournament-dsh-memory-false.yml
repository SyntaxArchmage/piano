version: 3

# Memory-disabled CUDA tuning variant: harness=dsh, model=deepseek-v4-flash, shape=tournament (race count 3).
# Every stage starts a fresh worker turn; automatic inputs and tournament topology are unchanged.
workflow:
  name: gpu-cuda-tuning-tournament-dsh-memory-false
  nodes:
    - stage:
        name: setup
        worker: cuda-setup
        harness: dsh
        model: deepseek-v4-flash
        memory: false
        thinkingLevel: high
        tools: [read, bash, edit, write]
        from: []

    - loop:
        name: tune
        from: [setup]
        feedback: race
        entry: profile
        exit: race          # the tournament region; resolves to its exit leaf `measure`
        iterations: 10
        nodes:
          - stage:
              name: profile
              worker: cuda-profile
              harness: dsh
              model: deepseek-v4-flash
              memory: false
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: []

          - stage:
              name: idea
              worker: cuda-idea-tournament
              harness: dsh
              model: deepseek-v4-flash
              memory: false
              thinkingLevel: high
              tools: [read, bash, edit, write, web_search]
              from: [profile]

          - tournament:
              name: race
              from: [idea]
              over: idea.strategies
              count: 3
              entry: implement
              exit: measure
              nodes:
                - stage:
                    name: implement
                    worker: cuda-implement-verify
                    harness: dsh
                    model: deepseek-v4-flash
                    memory: false
                    thinkingLevel: high
                    tools: [read, bash, edit, write]
                    from: []        # slot entry: this lane's strategy arrives as injected map-item context

                - stage:
                    name: measure
                    worker: cuda-benchmark-store
                    harness: dsh
                    model: deepseek-v4-flash
                    memory: false
                    thinkingLevel: high
                    tools: [read, bash, edit, write]
                    from: [implement]

    - stage:
        name: summary
        worker: cuda-summary
        harness: dsh
        model: deepseek-v4-flash
        memory: false
        thinkingLevel: high
        tools: [read, bash, edit, write]
        from: [tune]
