version: 3

# Cuda-tuning eval-matrix cell: harness=claude, model=gpt-5.6-luna, shape=serial.
# Same stage pipeline as the gpu-cuda-tuning family twins; only the
# harness/model/tools lines differ between cells of the matrix.
workflow:
  name: gpu-cuda-tuning-luna
  nodes:
    - stage:
        name: setup
        worker: cuda-setup
        harness: claude
        model: gpt-5.6-luna
        thinkingLevel: high
        tools: [Read, Bash, Edit, Write]
        from: []

    - loop:
        name: tune
        from: [setup]
        feedback: measure
        entry: profile
        exit: measure
        iterations: 10
        nodes:
          - stage:
              name: profile
              worker: cuda-profile
              harness: claude
              model: gpt-5.6-luna
              thinkingLevel: high
              tools: [Read, Bash, Edit, Write]
              from: []

          - stage:
              name: idea
              worker: cuda-idea
              harness: claude
              model: gpt-5.6-luna
              thinkingLevel: high
              tools: [Read, Bash, Edit, Write]
              from: [profile]

          - stage:
              name: implement
              worker: cuda-implement-verify
              harness: claude
              model: gpt-5.6-luna
              thinkingLevel: high
              tools: [Read, Bash, Edit, Write]
              from: [profile, idea]

          - stage:
              name: measure
              worker: cuda-benchmark-store
              harness: claude
              model: gpt-5.6-luna
              thinkingLevel: high
              tools: [Read, Bash, Edit, Write]
              from: [idea, implement]

    - stage:
        name: summary
        worker: cuda-summary
        harness: claude
        model: gpt-5.6-luna
        thinkingLevel: high
        tools: [Read, Bash, Edit, Write]
        from: [tune]
