version: 3

# Three-step repository-grounded coding workflow:
# architect -> developer tournament -> review-and-fix.
# There is intentionally no outer iteration. The tournament exit is metric-
# bearing: the coding candidate contract exposes test-pass evidence as
# benchmark/v1, with changed files/LOC used as deterministic secondary tie
# breakers. The reviewer owns the final fix after inspecting the selected
# candidate, so the workflow ends with a corrected reviewed workspace.
workflow:
  name: coding-team
  nodes:
    - stage:
        name: architect
        worker: coding-architect
        harness: claude
        model: mimo-v2.6-pro
        thinkingLevel: max
        discuss: true
        tools: [Read, Bash, Edit, Write, Glob, Grep, WebSearch]
        handoff: architecture.json
        validate: true
        from: []
    - tournament:
        name: candidates
        from: [architect]
        over: architect.implementation_plan
        count: 2
        entry: implement
        exit: implement
        nodes:
          - stage:
              name: implement
              worker: coding-developer
              harness: claude
              model: deepseek-flash
              thinkingLevel: max
              tools: [Read, Bash, Edit, Write, Glob, Grep]
              handoff: candidate-input.json
              validate: true
              from: []
    - stage:
        name: review
        worker: coding-reviewer
        harness: claude
        model: deepseek-flash
        thinkingLevel: max
        tools: [Read, Bash, Edit, Write, Glob, Grep]
        handoff: review-input.json
        validate: true
        from: [candidates]
