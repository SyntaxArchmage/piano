version: 3

# Three-step repository-grounded coding workflow (pi harness):
# architect -> developer tournament -> review-and-fix.
# The pi sibling of team-claude.yml; only the harness-specific tool names
# and mounting differ. `discuss` is a pi-only custom tool: it must appear in
# the stage's tools list or the discuss flag mounts nothing. The tournament
# exit is metric-bearing (coding-candidate benchmark/v1), and the reviewer
# owns the final fix after inspecting the selected candidate.
workflow:
  name: team-pi
  nodes:
    - stage:
        name: architect
        worker: coding-architect
        harness: pi
        model: mimo-v2.6-pro
        thinkingLevel: max
        discuss: true
        tools: [read, bash, edit, write, find, grep, ls, web_search, discuss]
        handoff: architecture.json
        validate: true
        from: []
    - tournament:
        name: candidates
        from: [architect]
        over: architect.implementation_plan
        count: 2
        entry: implement
        exit: implement
        nodes:
          - stage:
              name: implement
              worker: coding-developer
              harness: pi
              model: deepseek-flash
              thinkingLevel: max
              tools: [read, bash, edit, write, find, grep, ls]
              handoff: candidate-input.json
              validate: true
              from: []
    - stage:
        name: review
        worker: coding-reviewer
        harness: pi
        model: deepseek-flash
        thinkingLevel: max
        tools: [read, bash, edit, write, find, grep, ls]
        handoff: review-input.json
        validate: true
        from: [candidates]
