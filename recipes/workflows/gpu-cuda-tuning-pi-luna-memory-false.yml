version: 3

# Memory-disabled CUDA tuning variant: harness=pi, model=gpt-5.6-luna, serial.
# It preserves the standard six-stage pipeline and starts every stage turn fresh.
workflow:
  name: gpu-cuda-tuning-pi-luna-memory-false
  monitor: true
  nodes:
    - stage:
        name: setup
        worker: cuda-setup
        harness: pi
        model: gpt-5.6-luna
        memory: false
        thinkingLevel: high
        tools: [read, bash, edit, write]
        from: []

    - loop:
        name: tune
        from: [setup]
        feedback: measure
        entry: profile
        exit: measure
        iterations: 10
        nodes:
          - stage:
              name: profile
              worker: cuda-profile
              harness: pi
              model: gpt-5.6-luna
              memory: false
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: []

          - stage:
              name: idea
              worker: cuda-idea
              harness: pi
              model: gpt-5.6-luna
              memory: false
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: [profile]

          - stage:
              name: implement
              worker: cuda-implement-verify
              harness: pi
              model: gpt-5.6-luna
              memory: false
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: [profile, idea]

          - stage:
              name: measure
              worker: cuda-benchmark-store
              harness: pi
              model: gpt-5.6-luna
              memory: false
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: [idea, implement]

    - stage:
        name: summary
        worker: cuda-summary
        harness: pi
        model: gpt-5.6-luna
        memory: false
        thinkingLevel: high
        tools: [read, bash, edit, write]
        from: [tune]
