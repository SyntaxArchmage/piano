version: 3

# A journalled copy of gpu-cuda-tuning.yml. Each stage declares its own
# follow-up directly so the workflow shows what every worker will record.
workflow:
  name: gpu-cuda-tuning-epilogue
  monitor: true
  nodes:
    - stage:
        name: setup
        worker: cuda-setup
        harness: pi
        thinkingLevel: high
        tools: [read, bash, edit, write]
        from: []
        epilogue: |
          Append this prompt's progress to WORKLOG.md in the workspace root.
          You are cuda-setup. Use exactly:

              ## cuda-setup (setup@root) - <summary>
              did: <files or work produced>
              found: <facts, numbers, or failures>
              decided: <choice and reason>

          Write in the first person. Append only; do not change any other file.

    - loop:
        name: tune
        from: [setup]
        feedback: measure
        entry: profile
        exit: measure
        iterations: 10
        nodes:
          - stage:
              name: profile
              worker: cuda-profile
              harness: pi
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: []
              epilogue: |
                Append this prompt's progress to WORKLOG.md in the workspace root.
                You are cuda-profile. Use exactly:

                    ## cuda-profile (tune.profile@tune/iter-N) - <summary>
                    did: <files or work produced>
                    found: <facts, numbers, or failures>
                    decided: <choice and reason>

                Replace `N` with this prompt's iteration. Write in the first person.
                Append only; do not change any other file.

          - stage:
              name: idea
              worker: cuda-idea
              harness: pi
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: [profile]
              epilogue: |
                Append this prompt's progress to WORKLOG.md in the workspace root.
                You are cuda-idea. Use exactly:

                    ## cuda-idea (tune.idea@tune/iter-N) - <summary>
                    did: <files or work produced>
                    found: <facts, numbers, or failures>
                    decided: <choice and reason>

                Replace `N` with this prompt's iteration. Write in the first person.
                Append only; do not change any other file.

          - stage:
              name: implement
              worker: cuda-implement-verify
              harness: pi
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: [profile, idea]
              epilogue: |
                Append this prompt's progress to WORKLOG.md in the workspace root.
                You are cuda-implement-verify. Use exactly:

                    ## cuda-implement-verify (tune.implement@tune/iter-N) - <summary>
                    did: <files or work produced>
                    found: <facts, numbers, or failures>
                    decided: <choice and reason>

                Replace `N` with this prompt's iteration. Write in the first person.
                Append only; do not change any other file.

          - stage:
              name: measure
              worker: cuda-benchmark-store
              harness: pi
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: [idea, implement]
              epilogue: |
                Append this prompt's progress to WORKLOG.md in the workspace root.
                You are cuda-benchmark-store. Use exactly:

                    ## cuda-benchmark-store (tune.measure@tune/iter-N) - <summary>
                    did: <files or work produced>
                    found: <facts, numbers, or failures>
                    decided: <choice and reason>

                Replace `N` with this prompt's iteration. Write in the first person.
                Append only; do not change any other file.

    - stage:
        name: summary
        worker: cuda-summary
        harness: pi
        thinkingLevel: high
        tools: [read, bash, edit, write]
        from: [tune]
        epilogue: |
          Append this prompt's progress to WORKLOG.md in the workspace root.
          You are cuda-summary. Use exactly:

              ## cuda-summary (summary@root) - <summary>
              did: <files or work produced>
              found: <facts, numbers, or failures>
              decided: <choice and reason>

          Write in the first person. Append only; do not change any other file.
