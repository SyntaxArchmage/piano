version: 3

# Harness-variant twin of gpu-cuda-tuning for evals comparison and manual
# trials: identical stages on the claude harness, pinned to qwen3.8-flash
# (the model dimension against gpu-cuda-tuning-claude's deepseek-v4-flash).
# NOTE: qwen3.8-flash is not in the
# proven model set (scripts/agent.config.template.json); if the gateway
# rejects it, retry with qwen3.8-max or qwen3.8-27b.
workflow:
  name: gpu-cuda-tuning-qwen
  nodes:
    - stage:
        name: setup
        worker: cuda-setup
        harness: claude
        model: qwen3.8-flash
        thinkingLevel: high
        tools: [Read, Bash, Edit, Write]
        from: []

    - loop:
        name: tune
        from: [setup]
        feedback: measure
        entry: profile
        exit: measure
        iterations: 10
        nodes:
          - stage:
              name: profile
              worker: cuda-profile
              harness: claude
              model: qwen3.8-flash
              thinkingLevel: high
              tools: [Read, Bash, Edit, Write]
              from: []

          - stage:
              name: idea
              worker: cuda-idea
              harness: claude
              model: qwen3.8-flash
              thinkingLevel: high
              tools: [Read, Bash, Edit, Write]
              from: [profile]

          - stage:
              name: implement
              worker: cuda-implement-verify
              harness: claude
              model: qwen3.8-flash
              thinkingLevel: high
              tools: [Read, Bash, Edit, Write]
              from: [profile, idea]

          - stage:
              name: measure
              worker: cuda-benchmark-store
              harness: claude
              model: qwen3.8-flash
              thinkingLevel: high
              tools: [Read, Bash, Edit, Write]
              from: [idea, implement]

    - stage:
        name: summary
        worker: cuda-summary
        harness: claude
        model: qwen3.8-flash
        thinkingLevel: high
        tools: [Read, Bash, Edit, Write]
        from: [tune]
