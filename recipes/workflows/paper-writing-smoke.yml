version: 3

# Model team, selected from the repository's available evidence:
#   formulation/storyline       -> gpt-5.6-luna
#   figures/data plotting        -> qwen3.8-flash
#   academic writing/revise      -> deepseek-flash
#   audit/fact-check/review/finalize -> glm-5.3-flash
# DeepSeek has direct paper-run evidence; Qwen has the strongest structured/data
# benchmark result. Luna's framing role and GLM's independent audit role are
# role-based inferences, not a complete paper-quality A/B comparison.
# Paper-writing workflow: one interactive alignment stage, then a fully
# automatic polish loop that runs for a wall-clock duration.
#
#   prepare (discuss)  ──▶  calibrate  ──▶  ┌── polish loop (duration) ──┐  ──▶  finalize
#                                            storyline → figures → write
#                                            → audit → review → revise
#
# `prepare` is the only stage that talks to you. It asks, in one batch, for
# everything the automatic phase cannot invent: the working title and core
# claim, the code and data that back it, the contributions, the target venue
# and its template/page limit, and — most importantly — which finished papers
# are the standard to match. It writes `brief.json`; every later stage reads it.
#
# `calibrate` then distils your own finished papers into a *reference spec*: the
# section budget they actually use, the arc each one follows, the grammar of
# their figures, and the prose habits worth imitating. If a reference repository
# ships its own writing skills (`.cursor/skills/`, `.claude/skills/`), those are
# read first and outweigh rules the model infers on its own — they are your
# taste already written down. That spec, not the model's memory of "how papers
# are written", is what the loop optimizes against. The two stages the brief
# calls out by name are the closest thing this workflow has to a taste model.
#
# The `polish` loop is the automatic phase. One round = pick the weakest unit of
# the manuscript, design its storyline, make its figures, write it, audit every
# number and claim against the data, review it as the target venue's reviewer
# would, then fix what the audit and review found. The round's review threads
# into the next round's entry (`feedback: review`), so the loop always attacks
# what is currently worst rather than what it happens to feel like writing.
#
# `duration` — not `iterations` — bounds the loop, because a round's cost varies
# by an order of magnitude: revising one paragraph is minutes, generating a
# figure set from raw measurements is hours. A count would make the run's cost
# unknowable. The loop always runs at least one round, and the deadline is
# sampled between rounds, so one round may overshoot it. THIS IS THE KNOB FOR
# "how long may it work": 21600 is six hours. Set it to your remaining time.
# This is `paper-writing.yml` with the loop turned down to one minute, so it
# differs from the full template in exactly two lines: the workflow name and the
# loop's `duration`. Both are asserted by
# `tests/workflow/paper-writing-workflow.test.ts`.
#
# WHAT IT DOES AND DOES NOT PROVE. `duration` bounds the loop, not the run, so
# `prepare`, `calibrate` and `finalize` still run to completion and this file
# does not make them cheap. Its cost is those three stages plus exactly one loop
# round. What it proves is that every worker's agents.md, skill and contract
# load, that every stage's inputs resolve, that one full round completes, and
# that the loop exits on its deadline — a wiring check, not a fast test. Budget
# accordingly: a real `duration: 3600` run spent ~100 minutes in its single
# round, all of it doing real work, and passed its deadline at the 60-minute
# mark. The same round in this file would take the same two hours.
#
# It is also the wrong run to leave unattended on an untested repository: the
# retry policy here is the same unbounded one, so a setup that cannot produce a
# valid brief waits and retries until you stop it rather than failing early.
# Watch the first run until `calibrate` has been accepted once.
#
# Every stage declares `retry`, so a provider outage, a gateway hiccup, or a
# harness timeout is retried rather than ending the run — with an exponentially
# growing wait (30s doubling to a 15-minute cap) because by the time an error
# reaches this layer the cheap retries are already spent. Retries are unbounded:
# the run is meant to survive an unattended night. Press Escape to stop it; a
# human interrupt is never turned into a retry.
#
# Known asymmetry, deliberately left visible: `duration` bounds the LOOP, not
# the run. `prepare` and `calibrate` sit outside it, so an unbounded retry there
# is bounded only by you. A stage that cannot produce a valid result at all will
# therefore retry until you stop it, and the loop never starts. That is the
# intended trade — the alternative is a run that gives up at 03:00 — but it
# means a first run should be watched until `calibrate` has been accepted once.
#
# Every stage asks for `thinkingLevel: max`. Measured, not assumed, and the
# measurement is worth knowing: on `pi` + `deepseek-flash` this knob currently
# does nothing. A two-stage A/B probe (`max` then `off`, same model, same
# prompt) reported `thinkingLevel: off` for BOTH and produced 71 vs 78 reasoning
# tokens — the model reasons either way, because the reported level is whatever
# the SDK's model metadata says, not what the workflow asked for. The field is
# not dropped: it parses, validates, and reaches `createAgentSession`, and the
# `dsh` adapter honours it (a `high` request on `qwen3.8-flash` reports `high`).
# So: keep `max` for the harnesses that honour it, and do not expect it to
# explain a quality difference on this one.
#
# `timeout` is a per-turn runaway guard, deliberately far larger than any real
# turn: a timeout ends that attempt, and the retry policy picks it up again.
# It is sized so that ONE hung turn cannot swallow the whole loop budget. If you
# raise `duration`, raise these with it; if you lower the budget, these are the
# first thing to lower, because a single stuck turn priced above the budget is a
# run that ends without ever reaching `finalize`.
#
# The same asymmetry as above applies INSIDE the loop, and this one is easier to
# miss: `duration` bounds how long the loop may keep STARTING iterations, not how
# long the run may take. Two things can therefore run past the deadline, one by
# design and one by the retry policy:
#
#   1. The iteration in flight when the deadline passes always finishes. A round
#      is the unit of work, and a region clock cannot interrupt a turn — only
#      `stage.timeout` or a human can. A 6-hour loop whose last round starts at
#      5h59m ends whenever that round ends. Measured on a real 1-hour run: the
#      final round alone ran ~50 minutes past the deadline, because one stage in
#      it was doing real work the whole time.
#   2. An unbounded retry inside that round keeps the run alive past the
#      deadline. A stage that fails permanently past the deadline retries until
#      you stop it, and `finalize` is never reached. Read the two knobs
#      together: `duration` says "how long should it work", `retry` says "how
#      hard should it insist", and `unbounded` wins any argument between them.
#
# (1) is the design and is fine. (2) is the right trade for an unattended run
# over a working repository, where a transient provider fault is far likelier
# than a permanent stage failure — but it is the wrong trade while you are
# testing new workers, where a permanently broken stage is the thing you are
# looking for. For that run, set `attempts` to a finite number so the failure
# surfaces at the stage that caused it, instead of hiding behind a retry loop
# that outlives your patience.
#
# Wiring note that is easy to get wrong: a stage receives its inputs only from
# the nodes named in its own `from`, and inside the loop those names must be
# loop siblings. The brief and the reference spec can therefore enter the loop
# at exactly one place — the region's `from`, which feeds its entry. Everything
# the loop's later stages need from outside is re-stated by `paper-storyline`
# in its result's `context` block, and the later stages read it from there
# instead of looking for a document that never arrived.
#
# Workspace: every stage edits files in the process's working directory, so run
# piano from the manuscript repository. `paper-prepare` records the exact
# manuscript root, entry file, and compile command in the brief, and the loop
# uses those rather than guessing. Durable cross-round state lives in the
# brief's `manuscript.state_dir`, inside that repository, so a run can be
# resumed or re-run without losing the storyline.
workflow:
  name: paper-writing-smoke
  nodes:
    - stage:
        name: prepare
        worker: paper-prepare
        # pi mounts Piano's `discuss` tool natively; claude and dsh receive it
        # as `mcp__piano__discuss` through Piano's MCP bridge. The stage's
        # `tools` list below names the logical tool too — on pi omitting it is
        # a load error.
        harness: pi
        model: gpt-5.6-luna
        thinkingLevel: max
        # `discuss` must appear in BOTH places. The `discuss: true` flag below
        # supplies the callback; this list is the allowlist the session is
        # created with, and a tool that is not in it is not mounted however many
        # flags ask for it. Leaving it out is rejected at load today; before
        # that check existed it was a silent failure — a real run had the
        # worker report "no discuss tool was exposed in this invocation"
        # before deciding all twelve open questions by itself.
        tools: [read, bash, edit, write, find, grep, ls, discuss]
        discuss: true
        timeout: 3600
        retry:
          attempts: unbounded
          backoff: 30
          backoffMax: 900
        from: []

    - stage:
        name: calibrate
        worker: paper-calibrate
        harness: pi
        model: gpt-5.6-luna
        thinkingLevel: max
        tools: [read, bash, edit, write, find, grep, ls]
        timeout: 3600
        retry:
          attempts: unbounded
          backoff: 30
          backoffMax: 900
        from: [prepare]

    - loop:
        name: polish
        # The loop entry receives the region's `from` inputs; the loop's other
        # stages can only reference their own siblings, so this is the ONE
        # place the brief and the reference spec can enter the loop. Both are
        # needed: the brief carries the venue and the core claim, the spec
        # carries the budget, arc and figure grammar every round is judged
        # against.
        from: [prepare, calibrate]
        entry: storyline
        exit: revise
        # The reviewer's issues are this loop's memory: the next round starts
        # from what the last review said was wrong.
        feedback: review
        duration: 60                  # one minute: this variant's only difference besides the name
        nodes:
          - stage:
              name: storyline
              worker: paper-storyline
              harness: pi
              model: gpt-5.6-luna
              thinkingLevel: max
              tools: [read, bash, edit, write, find, grep, ls]
              timeout: 2400
              retry:
                attempts: unbounded
                backoff: 30
                backoffMax: 900
              from: []

          - stage:
              name: figures
              worker: paper-figures
              harness: pi
              model: qwen3.8-flash
              thinkingLevel: max
              tools: [read, bash, edit, write, find, grep, ls]
              # Figure generation runs real data scripts; it gets the longest
              # single-turn allowance in the loop.
              timeout: 3600
              retry:
                attempts: unbounded
                backoff: 30
                backoffMax: 900
              from: [storyline]

          - stage:
              name: write
              worker: paper-write
              harness: pi
              model: deepseek-flash
              thinkingLevel: max
              tools: [read, bash, edit, write, find, grep, ls]
              timeout: 3600
              retry:
                attempts: unbounded
                backoff: 30
                backoffMax: 900
              from: [storyline, figures]

          - stage:
              name: audit
              worker: paper-audit
              harness: pi
              model: glm-5.3-flash
              thinkingLevel: max
              tools: [read, bash, edit, write, find, grep, ls]
              timeout: 2400
              retry:
                attempts: unbounded
                backoff: 30
                backoffMax: 900
              # `storyline` is a carrier dependency, not a scheduling one: it
              # is how this stage receives the brief, the venue and the
              # reference spec. Its own skill checks numbers against the
              # brief's evidence roots, which arrive only through it.
              from: [storyline, write]

          - stage:
              name: review
              worker: paper-review
              harness: pi
              model: glm-5.3-flash
              thinkingLevel: max
              # The reviewer's first blocker is usually "the closest prior work
              # is not cited". Without a web tool that attack cannot be raised
              # or refuted, and a reviewer with no way to check will invent the
              # prior work instead. The skill tells it to search only to verify
              # a claim it is about to make.
              tools: [read, bash, edit, write, find, grep, ls, web_search]
              timeout: 2400
              retry:
                attempts: unbounded
                backoff: 30
                backoffMax: 900
              from: [storyline, write, audit]

          - stage:
              name: revise
              worker: paper-revise
              harness: pi
              model: deepseek-flash
              thinkingLevel: max
              tools: [read, bash, edit, write, find, grep, ls]
              timeout: 3600
              retry:
                attempts: unbounded
                backoff: 30
                backoffMax: 900
              # This stage is the loop's only reporter to `finalize`, so it
              # needs the same context the loop ran on.
              from: [storyline, audit, review]

    - stage:
        name: finalize
        worker: paper-finalize
        harness: pi
        model: glm-5.3-flash
        thinkingLevel: max
        tools: [read, bash, edit, write, find, grep, ls]
        timeout: 2400
        retry:
          attempts: unbounded
          backoff: 30
          backoffMax: 900
        from: [polish, prepare, calibrate]
