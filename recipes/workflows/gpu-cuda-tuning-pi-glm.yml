version: 3

# Cuda-tuning eval-matrix cell: harness=pi, model=glm-5.3-flash, shape=serial.
# Same stage pipeline as the gpu-cuda-tuning family twins; only the
# harness/model/tools lines differ between cells of the matrix.
workflow:
  name: gpu-cuda-tuning-pi-glm
  nodes:
    - stage:
        name: setup
        worker: cuda-setup
        harness: pi
        model: glm-5.3-flash
        thinkingLevel: high
        tools: [read, bash, edit, write]
        from: []

    - loop:
        name: tune
        from: [setup]
        feedback: measure
        entry: profile
        exit: measure
        iterations: 10
        nodes:
          - stage:
              name: profile
              worker: cuda-profile
              harness: pi
              model: glm-5.3-flash
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: []

          - stage:
              name: idea
              worker: cuda-idea
              harness: pi
              model: glm-5.3-flash
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: [profile]

          - stage:
              name: implement
              worker: cuda-implement-verify
              harness: pi
              model: glm-5.3-flash
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: [profile, idea]

          - stage:
              name: measure
              worker: cuda-benchmark-store
              harness: pi
              model: glm-5.3-flash
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: [idea, implement]

    - stage:
        name: summary
        worker: cuda-summary
        harness: pi
        model: glm-5.3-flash
        thinkingLevel: high
        tools: [read, bash, edit, write]
        from: [tune]
