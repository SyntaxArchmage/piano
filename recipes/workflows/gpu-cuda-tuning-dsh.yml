version: 3

# Harness-variant twin of gpu-cuda-tuning for evals comparison and manual
# trials: identical stages, but every stage runs on the dsh Pi harness with the
# proven gateway model deepseek-v4-flash pinned per stage.
workflow:
  name: gpu-cuda-tuning-dsh
  nodes:
    - stage:
        name: setup
        worker: cuda-setup
        harness: dsh
        model: deepseek-v4-flash
        thinkingLevel: high
        tools: [read, bash, edit, write]
        from: []

    - loop:
        name: tune
        from: [setup]
        feedback: measure
        entry: profile
        exit: measure
        iterations: 10
        nodes:
          - stage:
              name: profile
              worker: cuda-profile
              harness: dsh
              model: deepseek-v4-flash
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: []

          - stage:
              name: idea
              worker: cuda-idea
              harness: dsh
              model: deepseek-v4-flash
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: [profile]

          - stage:
              name: implement
              worker: cuda-implement-verify
              harness: dsh
              model: deepseek-v4-flash
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: [profile, idea]

          - stage:
              name: measure
              worker: cuda-benchmark-store
              harness: dsh
              model: deepseek-v4-flash
              thinkingLevel: high
              tools: [read, bash, edit, write]
              from: [idea, implement]

    - stage:
        name: summary
        worker: cuda-summary
        harness: dsh
        model: deepseek-v4-flash
        thinkingLevel: high
        tools: [read, bash, edit, write]
        from: [tune]
