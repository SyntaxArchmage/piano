version: 3
workflow:
  name: perf-inputs
  nodes:
    - stage:
        name: producer
        worker: basic
        harness: pi
        model: deepseek-flash
        thinkingLevel: low
        tools: [read, write]
        from: []
    - stage:
        name: consumer
        worker: basic
        harness: pi
        model: deepseek-flash
        thinkingLevel: low
        tools: [read, write]
        from: [producer]
    - stage:
        name: aggregator
        worker: basic
        harness: pi
        model: deepseek-flash
        thinkingLevel: low
        tools: [read, write]
        from: [consumer]
