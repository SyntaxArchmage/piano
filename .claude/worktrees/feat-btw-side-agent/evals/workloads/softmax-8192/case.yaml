version: 1
id: softmax-8192
group: tuning
prompt: |
  Implement and optimize a Triton row-wise softmax kernel for an 8192x8192
  float32 matrix. Write the kernel in `kernel.py`, exposing `run(X) -> Y`.
  Use the online (numerically stable) softmax algorithm. Verify with
  `python verify.py`; it prints `VERIFY: PASS` and `TFLOPS: <value>`.
command: piano --workflow <workflow> -p <prompt>
workspace: workspace
workflow: ../../../recipes/workflows/gpu-triton-tuning.yml
readout:
  kind: programmatic
  compileCommand: "python -c 'import kernel; assert hasattr(kernel, \"run\")'"
  verifyCommand: "python verify.py"
  benchmarkCommand: "python verify.py"
  baselineCommand: "python verify.py"
  metricPattern: "TFLOPS: ([0-9.]+)"
  tolerance: 0.001
metric:
  name: tflops
  direction: higher
workload:
  operator: softmax
  shape: "8192x8192 f32"
  language: python
  description: Triton softmax 8192x8192 f32
tags:
  - tag: tflops
    weight: 2
  - tag: correctness
    weight: 2
