# Rationale: instantiates Terminal-Bench's "core CLI workflows" category
# (write & debug shell scripts, process via standard Unix utilities). A small
# executable script exercised through its stdout is the canonical unit there;
# graded by running it and asserting the emitted line.
version: 1
id: write-script
group: agentic
prompt: |
  Write an executable bash script named `sum.sh` in the current directory.
  It takes two integer command-line arguments and prints their sum on a
  single line, with no extra output. Make it executable (chmod +x).
command: piano -p <prompt>
workspace: workspace
readout:
  kind: programmatic
  compileCommand: "chmod +x sum.sh"
  verifyCommand: "test \"$(bash sum.sh 3 5)\" = \"8\""
tags:
  - tag: correctness
    weight: 2
