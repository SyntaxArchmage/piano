# GitLab CI for the piano monorepo.
# Runs on the locked project runner registered on heng.shi's devbox
# (shell executor: Node 22 + git are host-provided; Docker Hub is not
# reachable from this network, so container images are not used).
# Verification gate mirrors package.json: typecheck -> lint -> test.

stages:
  - verify

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH   # plain branch pushes (incl. main)

verify:
  stage: verify
  interruptible: true
  # npm ci occasionally dies with ETXTBSY on the esbuild binary (write/exec
  # race on the host FS); one automatic retry absorbs that flake.
  retry:
    max: 1
    when:
      - script_failure
      - runner_system_failure
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run typecheck
    - npm run lint
    - npm test
