version: 3

# Repository-grounded architecture -> developer tournament -> review loop.
# The tournament exit is deliberately metric-bearing: the coding candidate
# contract exposes test-pass evidence as benchmark/v1, with changed files/LOC
# used as deterministic secondary tie breakers. Candidates must report those
# values honestly; source/test tampering is disallowed by the worker contract.
workflow:
  name: coding-team
  nodes:
    - loop:
        name: team
        from: []
        feedback: review
        entry: architect
        exit: review
        iterations: 2
        nodes:
          - stage:
              name: architect
              worker: coding-architect
              harness: claude
              model: claude-sonnet-4-6
              thinkingLevel: max
              # Headless/eval runs receive the deterministic self-decision reply;
              # keep the primitive enabled so interactive TUI runs can still ask.
              discuss: true
              tools: [Read, Bash, Edit, Write, Glob, Grep, WebSearch]
              handoff: architecture.json
              validate: true
              from: []
          - tournament:
              name: candidates
              from: [architect]
              over: architect.implementation_plan
              count: 3
              entry: implement
              exit: verify
              nodes:
                - stage:
                    name: implement
                    worker: coding-developer
                    harness: claude
                    model: gpt-5.6-luna
                    thinkingLevel: max
                    tools: [Read, Bash, Edit, Write, Glob, Grep]
                    handoff: candidate-input.json
                    validate: true
                    from: []
                - stage:
                    name: verify
                    worker: coding-developer
                    harness: claude
                    model: gpt-5.6-luna
                    thinkingLevel: max
                    tools: [Read, Bash, Edit, Write, Glob, Grep]
                    handoff: candidate.json
                    validate: true
                    from: [implement]
          - stage:
              name: review
              worker: coding-reviewer
              harness: claude
              model: gpt-5.6-luna
              thinkingLevel: max
              tools: [Read, Bash, Edit, Write, Glob, Grep]
              handoff: review-input.json
              validate: true
              from: [candidates]
