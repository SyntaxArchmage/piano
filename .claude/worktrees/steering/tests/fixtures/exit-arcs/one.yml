version: 3

# Exit-arc guards (tests/tui/exit-arcs.pty.test.ts): the smallest real stack
# for "the workflow ends when the last worker finishes". One stage, one worker,
# pi-cli subprocess pointed at the deterministic stand-in binary.
workflow:
  name: exit-arcs-one
  nodes:
    - stage:
        name: respond
        worker: basic
        harness: pi-cli
        tools: [read, bash, edit, write]
        from: []
