version: 3

# Serial variant of gpu-cuda-tuning. Identical stage pipeline, except the
# round's implement→measure work runs as a per-iteration tournament: `idea`
# emits several distinct strategies, `race` fans one lane per strategy, and the
# winner is decided once when the race region exits (benchmark metric decides,
# winner's own worker consolidates the shared source). The loop therefore
# enters and exits the tournament exactly once per iteration; the next
# iteration starts from the consolidated winner.
#
# `model` is intentionally omitted from every stage so Pi resolves the user's
# configured model (request > stage > PIANO_PI_MODEL > ~/.piano/agent.config).
# `thinkingLevel` is explicit because tuning needs deliberate reasoning effort;
# Pi maps this level to the provider-specific reasoning control.
#
# This is the serial arm of the experiment: `gpu-cuda-tuning-tournament.yml`
# under a different workflow name, with `race` declaring `parallel: false` so
# its three strategy lanes run one at a time instead of concurrently. The switch
# is this workflow's own fan-out knob and is unrelated to the eval runner's
# `piano evals --parallel` matrix option.
workflow:
  name: gpu-cuda-tuning-tournament-serial
  nodes:
    - stage:
        name: setup
        worker: cuda-setup
        harness: pi
        thinkingLevel: high
        tools: [read, bash, edit, write]
        handoff: preparation.json
        validate: true
        from: []

    - loop:
        name: tune
        from: [setup]
        feedback: race
        entry: profile
        exit: race          # the tournament region; resolves to its exit leaf `measure`
        iterations: 10
        nodes:
          - stage:
              name: profile
              worker: cuda-profile
              harness: pi
              thinkingLevel: high
              tools: [read, bash, edit, write]
              handoff: iteration.json
              validate: true
              from: []

          - stage:
              name: idea
              worker: cuda-idea-tournament
              harness: pi
              thinkingLevel: high
              tools: [read, bash, edit, write]
              handoff: profile.json
              validate: true
              from: [profile]

          - tournament:
              name: race
              from: [idea]
              over: idea.strategies
              count: 3
              parallel: false     # serial lanes: the serial arm of the A/B tuning experiment
              entry: implement
              exit: measure
              nodes:
                - stage:
                    name: implement
                    worker: cuda-implement-verify
                    harness: pi
                    thinkingLevel: high
                    tools: [read, bash, edit, write]
                    handoff: implementation-inputs.json
                    validate: true
                    from: []        # slot entry: this lane's strategy arrives as injected map-item context

                - stage:
                    name: measure
                    worker: cuda-benchmark-store
                    harness: pi
                    thinkingLevel: high
                    tools: [read, bash, edit, write]
                    handoff: round.json
                    validate: true
                    from: [implement]

    - stage:
        name: summary
        worker: cuda-summary
        harness: pi
        thinkingLevel: high
        tools: [read, bash, edit, write]
        handoff: tuning.json
        validate: true
        from: [tune]
