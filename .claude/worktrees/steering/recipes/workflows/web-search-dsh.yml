version: 3

# dsh mounts web_search by default. Piano's generated overlay removes it for
# stages that do not declare it, making this declaration the capability switch.
workflow:
  name: web-search-dsh
  nodes:
    - stage:
        name: search
        worker: basic
        harness: dsh
        thinkingLevel: high
        tools: [web_search]
        from: []
