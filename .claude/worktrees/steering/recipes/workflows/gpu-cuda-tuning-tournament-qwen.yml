version: 3

# Cuda-tuning eval-matrix cell: harness=claude, model=qwen3.8-flash, shape=tournament (race count 3).
# Same stage pipeline as the gpu-cuda-tuning family twins; only the
# harness/model/tools lines differ between cells of the matrix.
workflow:
  name: gpu-cuda-tuning-tournament-qwen
  nodes:
    - stage:
        name: setup
        worker: cuda-setup
        harness: claude
        model: qwen3.8-flash
        thinkingLevel: high
        tools: [Read, Bash, Edit, Write]
        handoff: preparation.json
        validate: true
        from: []

    - loop:
        name: tune
        from: [setup]
        feedback: race
        entry: profile
        exit: race          # the tournament region; resolves to its exit leaf `measure`
        iterations: 10
        nodes:
          - stage:
              name: profile
              worker: cuda-profile
              harness: claude
              model: qwen3.8-flash
              thinkingLevel: high
              tools: [Read, Bash, Edit, Write]
              handoff: iteration.json
              validate: true
              from: []

          - stage:
              name: idea
              worker: cuda-idea-tournament
              harness: claude
              model: qwen3.8-flash
              thinkingLevel: high
              tools: [Read, Bash, Edit, Write]
              handoff: profile.json
              validate: true
              from: [profile]

          - tournament:
              name: race
              from: [idea]
              over: idea.strategies
              count: 3
              entry: implement
              exit: measure
              nodes:
                - stage:
                    name: implement
                    worker: cuda-implement-verify
                    harness: claude
                    model: qwen3.8-flash
                    thinkingLevel: high
                    tools: [Read, Bash, Edit, Write]
                    handoff: implementation-inputs.json
                    validate: true
                    from: []        # slot entry: this lane's strategy arrives as injected map-item context

                - stage:
                    name: measure
                    worker: cuda-benchmark-store
                    harness: claude
                    model: qwen3.8-flash
                    thinkingLevel: high
                    tools: [Read, Bash, Edit, Write]
                    handoff: round.json
                    validate: true
                    from: [implement]

    - stage:
        name: summary
        worker: cuda-summary
        harness: claude
        model: qwen3.8-flash
        thinkingLevel: high
        tools: [Read, Bash, Edit, Write]
        handoff: tuning.json
        validate: true
        from: [tune]
