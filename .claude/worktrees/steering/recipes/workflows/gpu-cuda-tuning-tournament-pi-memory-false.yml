version: 3

# Memory-disabled CUDA tuning variant: harness=pi, tournament (race count 3).
# It preserves the tournament topology and starts every stage turn fresh.
workflow:
  name: gpu-cuda-tuning-tournament-pi-memory-false
  nodes:
    - stage:
        name: setup
        worker: cuda-setup
        harness: pi
        memory: false
        thinkingLevel: high
        tools: [read, bash, edit, write]
        handoff: preparation.json
        validate: true
        from: []

    - loop:
        name: tune
        from: [setup]
        feedback: race
        entry: profile
        exit: race          # the tournament region; resolves to its exit leaf `measure`
        iterations: 10
        nodes:
          - stage:
              name: profile
              worker: cuda-profile
              harness: pi
              memory: false
              thinkingLevel: high
              tools: [read, bash, edit, write]
              handoff: iteration.json
              validate: true
              from: []

          - stage:
              name: idea
              worker: cuda-idea-tournament
              harness: pi
              memory: false
              thinkingLevel: high
              tools: [read, bash, edit, write]
              handoff: profile.json
              validate: true
              from: [profile]

          - tournament:
              name: race
              from: [idea]
              over: idea.strategies
              count: 3
              entry: implement
              exit: measure
              nodes:
                - stage:
                    name: implement
                    worker: cuda-implement-verify
                    harness: pi
                    memory: false
                    thinkingLevel: high
                    tools: [read, bash, edit, write]
                    handoff: implementation-inputs.json
                    validate: true
                    from: []

                - stage:
                    name: measure
                    worker: cuda-benchmark-store
                    harness: pi
                    memory: false
                    thinkingLevel: high
                    tools: [read, bash, edit, write]
                    handoff: round.json
                    validate: true
                    from: [implement]

    - stage:
        name: summary
        worker: cuda-summary
        harness: pi
        memory: false
        thinkingLevel: high
        tools: [read, bash, edit, write]
        handoff: tuning.json
        validate: true
        from: [tune]
