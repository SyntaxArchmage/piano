version: 1
id: cuda-matmul-tuning-tournament-pi-dsv4f-serial-memory-false
group: tuning-cuda
prompt: |
  Implement and optimize a native C++/CUDA GEMM for 512x512x512 float32
  matrices in `matmul.cu`. Keep the standalone command-line contract:
  `--verify` checks the GPU result against the CPU reference and prints
  `VERIFY: PASS` or `VERIFY: FAIL`; `--bench` prints `TFLOPS: <value>`.
  Start from the correct seed and make one evidence-backed optimization per
  round (for example shared-memory tiling, register blocking, or load
  vectorization). Do not use cuBLAS, CUTLASS, PyTorch, or another library for
  the candidate's core computation, and do not edit the grader-owned
  `verify.py`, `profile.py`, or `setup.py` files.
command: piano --workflow <workflow> -p <prompt>
workspace: ../cuda-matmul-tuning-tournament-pi-dsv4f/workspace
workflow: ../../../recipes/workflows/gpu-cuda-tuning-tournament-serial-memory-false.yml
readout:
  kind: programmatic
  compileCommand: "python3 verify.py --compile"
  verifyCommand: "python3 verify.py --verify"
  benchmarkCommand: "python3 verify.py --bench"
  baselineCommand: "python3 verify.py --bench"
  metricPattern: "TFLOPS: ([0-9.]+)"
  tolerance: 0.0001
metric:
  name: tflops
  direction: higher
workload:
  operator: matmul
  shape: "512x512x512 f32"
  language: cuda
  description: Native C++/CUDA GEMM with a standalone nvcc build, CPU-reference verification, and TFLOPS benchmark.
tags:
  - tag: tflops
    weight: 2
  - tag: correctness
    weight: 2
