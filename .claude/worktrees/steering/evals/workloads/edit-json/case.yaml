# Rationale: instantiates the data/structure-editing category. Grounded in
# ShellOps "Edit" task axis (structured file trees; exact file-state grading)
# and MyClaw's `file_ops` (config search & replace), plus SWE-bench's edit-type
# issues that mutate an existing tree in place. Unlike create-file, the artifact
# already exists and the agent must make a precise, delimited edit.
version: 1
id: edit-json
group: agentic
prompt: |
  Read the file `data.json` in the current directory. Modify it so that:
  - the `age` field is incremented by 1
  - a new field `email` with value "alice@example.com" is added
  - the `"b"` entry is removed from the `tags` array
  Write the result back to `data.json`, preserving valid JSON formatting.
command: piano -p <prompt>
workspace: workspace
readout:
  kind: programmatic
  compileCommand: "true"
  verifyCommand: "python3 -c \"import json; d=json.load(open('data.json')); assert d['age']==31; assert d['email']=='alice@example.com'; assert d['tags']==['a']\""
tags:
  - tag: correctness
    weight: 2
