version: 1
id: case-0-basic-write
group: agentic
prompt: Create a file named hello.py containing a function greet() returning "hi".
command: piano -p <prompt>
workspace: workspace
readout:
  kind: programmatic
  compileCommand: "true"
  verifyCommand: "python3 -c \"import hello; assert hello.greet() == 'hi'\""
tags:
  - tag: correctness
    weight: 1
