version: 3

# Exit-arc guards: the multi-worker shape — two parallel roots joined by a
# third worker. The run may only end after all three scripted turns land.
workflow:
  name: exit-arcs-two
  nodes:
    - stage:
        name: left
        worker: basic
        harness: pi-cli
        tools: [read, bash, edit, write]
        from: []
    - stage:
        name: right
        worker: basic
        harness: pi-cli
        tools: [read, bash, edit, write]
        from: []
    - stage:
        name: joined
        worker: basic
        harness: pi-cli
        from: [left, right]
