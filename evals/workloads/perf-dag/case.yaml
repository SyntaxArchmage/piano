version: 1
id: perf-dag
group: workflow-perf
dimensions:
  task: perf-dag
  harness: pi
  model: deepseek-flash
  effort: medium
prompt: "Reply with OK."
command: piano --workflow <workflow> -p <prompt>
workspace: ../../workspaces/perf-empty
workflow: ../../../recipes/eval-workflows/perf-dag.yml
readout:
  kind: programmatic
  compileCommand: "true"
  verifyCommand: "true"
  benchmarkCommand: "node runtime-metric.mjs"
  metricPattern: "runtime_overhead_ms: ([0-9.]+)"
metric:
  name: runtime_overhead_ms
  direction: lower
acceptance:
  requireEvidence: false

tags:
  - tag: wall-clock
    weight: 3
  - tag: orchestration
    weight: 1
