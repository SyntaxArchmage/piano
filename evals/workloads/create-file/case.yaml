# Rationale: instantiates the isolated function-generation category shared by
# HumanEval (164 hand-written Python `fn signature + docstring -> body` problems)
# and MBPP (974 crowd-sourced Python tasks, ~58% math / ~43% list ops), plus
# SWE-bench's self-contained single-file implementation tasks. A self-contained
# source file with one named, importable function is the minimal, well-specified
# unit all three grade with hidden tests (pass@k / assert).
version: 1
id: create-file
group: agentic
prompt: |
  Create a new Python file named `greet.py` in the current directory. It must
  define a function `greet()` that returns the string "hi". Do not add
  anything else. Make sure the file is valid Python and importable.
command: piano -p <prompt>
workspace: workspace
readout:
  kind: programmatic
  compileCommand: "true"
  verifyCommand: "python3 -c \"import greet; assert greet.greet() == 'hi'\""
tags:
  - tag: correctness
    weight: 2
  - tag: completeness
    weight: 1
