version: 1
id: matmul-512
group: tuning
prompt: |
  Implement and optimize a Triton matrix-multiplication kernel for 512x512x512
  float32 matrices. Write the kernel in `kernel.py`, exposing `run(A, B) -> C`.
  Start from a correct naive tiled implementation, then improve it (tiling,
  vectorized loads, larger blocks) for higher throughput. Verify with
  `python verify.py`; it prints `VERIFY: PASS` and `TFLOPS: <value>`.
command: piano --workflow <workflow> -p <prompt>
workspace: workspace
workflow: ../../../recipes/workflows/gpu-triton-tuning.yml
readout:
  kind: programmatic
  compileCommand: "python -c 'import kernel; assert hasattr(kernel, \"run\")'"
  verifyCommand: "python verify.py"
  benchmarkCommand: "python verify.py"
  baselineCommand: "python verify.py"
  metricPattern: "TFLOPS: ([0-9.]+)"
  tolerance: 0.001
metric:
  name: tflops
  direction: higher
workload:
  operator: matmul
  shape: "512x512x512 f32"
  language: python
  description: Triton matmul 512x512x512 f32
tags:
  - tag: tflops
    weight: 2
  - tag: correctness
    weight: 2
